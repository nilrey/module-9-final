stages:
  - lint
  - test
  - build
  - deploy

default:
  tags: [k8s]
  image: python:3.12-bookworm

variables:
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: plain

# Подготовка виртуального окружения (можно вынести в .setup_venv.yml)
.setup_venv: &setup_venv
  before_script:
    - pip install uv
    - uv venv
    - source .venv/bin/activate
    - uv pip install -r requirements.txt

ruff_lint:
  stage: lint
  <<: *setup_venv
  script:
    - uv pip install ruff
    - ruff check src --fix
  only:
    - main
    - merge_requests

mypy_check:
  stage: lint
  <<: *setup_venv
  script:
    - uv pip install mypy
    - mypy src --ignore-missing-imports
  only:
    - main
    - merge_requests

pytest_tests:
  stage: test
  <<: *setup_venv
  script:
    - pytest tests/ -v
  only:
    - main
    - merge_requests

docker_build:
  stage: build
  image: gcr.io/kaniko-project/executor:debug
  script:
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context="${CI_PROJECT_DIR}"
      --dockerfile="${CI_PROJECT_DIR}/Dockerfile"
      --destination="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      --destination="${CI_REGISTRY_IMAGE}:latest"
      --cache=true
  only:
    - main

deploy_to_vm:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-cli
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
  script:
    - ssh -o StrictHostKeyChecking=no $VM_USER@$VM_IP "
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        cd /opt/recommender &&
        docker-compose down &&
        docker-compose pull &&
        docker-compose up -d
      "
  only:
    - main
  when: manual

  